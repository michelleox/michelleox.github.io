<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#132448"><title>Pará Votos — apuração 2026</title><style>
:root{--bg:#132448;--panel:#0d1b36;--ink:#f4f7ff;--muted:#9eacc7;--line:#26385a;--accent:#62e8bc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px system-ui,-apple-system,"Segoe UI",sans-serif}.shell{max-width:840px;margin:auto;padding:58px 20px}.eyebrow{color:var(--accent);font-size:10px;font-weight:800;letter-spacing:.16em}.shell h1{font-size:54px;line-height:1;margin:16px 0 10px;letter-spacing:-.05em}.lede{color:var(--muted);margin:0 0 28px}.controls,.summary,.results-card{background:var(--panel);border:1px solid var(--line);border-radius:14px}.controls{display:flex;gap:12px;padding:16px;align-items:end}label{flex:1;color:var(--muted);font-size:11px;font-weight:700}select{display:block;width:100%;margin-top:7px;background:#18294a;border:1px solid #304464;border-radius:7px;color:var(--ink);padding:11px;font:inherit}button{background:var(--accent);border:0;border-radius:7px;color:#071c2a;font-weight:800;padding:12px 16px;cursor:pointer}.status{color:#f5ca72;margin:18px 2px;font-size:12px}.status.ok{color:var(--accent)}.status.bad{color:#ff9e9e}.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;margin-bottom:14px;overflow:hidden}.metric{padding:16px;background:#10203e}.metric small{display:block;color:var(--muted);font-size:11px}.metric strong{display:block;font-size:17px;margin-top:7px}.results-card{padding:20px}.head{display:flex;justify-content:space-between;align-items:start;border-bottom:1px solid var(--line);padding-bottom:15px}.head h2{margin:0;font-size:22px}.head p{margin:6px 0 0;color:var(--muted);font-size:12px}.secondary{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:11px}.error{color:#ffb1b1;background:#3b1e31;padding:12px;border-radius:7px;margin:14px 0;font-size:12px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;margin-top:8px;text-align:left}th{color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.1em}th,td{padding:14px 8px;border-bottom:1px solid var(--line)}td:not(:first-child),th:not(:first-child){text-align:right}.candidate{font-weight:700}.party{display:block;color:var(--muted);font-size:11px;font-weight:400;margin-top:4px}.empty{text-align:left!important;color:var(--muted)}footer{color:var(--muted);font-size:11px;padding-top:22px}a{color:var(--accent)}@media(max-width:620px){.shell{padding:34px 14px}.shell h1{font-size:44px}.controls{display:block}.controls label{display:block;margin-bottom:12px}.controls button{width:100%}.summary{grid-template-columns:repeat(2,1fr)}.head{gap:10px}.secondary{padding:9px 10px}}
</style></head><body><main class="shell"><header><p class="eyebrow">APURAÇÃO OFICIAL · ELEIÇÕES 2026</p><h1>Pará Votos</h1><p class="lede">Acompanhe os dados publicados pelo Tribunal Superior Eleitoral para o estado do Pará.</p></header><section class="controls"><label>Cargo<select id="office"></select></label><label>Atualização automática<select id="interval"><option value="0">Desligada</option><option value="30">30 segundos</option><option value="60" selected>1 minuto</option><option value="300">5 minutos</option></select></label><button id="refresh">Atualizar agora</button></section><div id="status" class="status">Carregando dados oficiais…</div><section id="summary" class="summary"></section><section class="results-card"><div class="head"><div><h2 id="title">Resultados</h2><p id="scope"></p></div><button id="sort" class="secondary">Ordenar: votos ↓</button></div><div id="error" class="error" hidden></div><div class="table-wrap"><table><thead><tr><th>Candidato</th><th>Nº</th><th>Votos</th><th>Percentual</th></tr></thead><tbody id="candidates"></tbody></table></div></section><footer>Fonte: <a href="https://resultados.tse.jus.br/" target="_blank" rel="noreferrer">Resultados TSE</a>. Dados oficiais, sujeitos à atualização da totalização.</footer></main><script>
const SOURCES={depFederal:{label:'Deputado federal',url:'https://resultados.tse.jus.br/oficial/ele2026/6259/dados/pa/pa-c0006-e006259-u.json',candidates:true},senador:{label:'Senador',url:'https://resultados.tse.jus.br/oficial/ele2026/6259/dados/pa/pa-c0005-e006259-u.json',candidates:true},governador:{label:'Governador',url:'https://resultados.tse.jus.br/oficial/ele2026/6259/dados/pa/pa-c0003-e006259-u.json',candidates:true},depEstadual:{label:'Deputado estadual',url:'https://resultados.tse.jus.br/oficial/ele2026/6259/dados/pa/pa-c0007-e006259-u.json',candidates:true},presidente:{label:'Presidente',url:'https://resultados.tse.jus.br/oficial/ele2026/6259/dados/br/br-e006259-ab.json',candidates:false}};
const state={key:'governador',rows:[],descending:true,timer:null},$=id=>document.getElementById(id),num=v=>{const n=Number(String(v??'').replace(/\./g,'').replace(',','.'));return Number.isFinite(n)?n:null},txt=(o,ks)=>{for(const k of ks)if(o&&o[k]!=null&&o[k]!=='')return String(o[k]);return''},fmt=n=>n==null?'—':new Intl.NumberFormat('pt-BR').format(n),esc=v=>String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function parse(data,s){const root=s.candidates?data:(data.abr||[]).find(x=>x.tpabr==='uf'&&String(x.cdabr).toLowerCase()==='pa');if(!root)throw Error('Recorte do Pará não encontrado no JSON oficial.');const carg=Array.isArray(data.carg)?data.carg[0]:null,rows=[];if(s.candidates&&carg)for(const g of carg.agr||[])for(const p of g.par||[])for(const c of p.cand||[])rows.push({name:txt(c,['nmu','nm'])||'Candidato sem nome',number:txt(c,['n'])||'—',party:txt(p,['sg','nm'])||txt(g,['com','nm']),votes:num(txt(c,['vap','v']))??0,pct:num(txt(c,['pvap','p']))});const v=root.v||data.v||{};return{title:carg?txt(carg,['nmn','nmm']):s.label,rows,valid:num(v.vvc??v.vv),total:num(v.tv??v.tvn),counted:root.e?num(root.e.esnt??root.e.te):null,updated:[data.dg,data.hg].filter(Boolean).join(' ')};}
async function load(){const s=SOURCES[state.key];$('status').className='status';$('status').textContent=`Buscando ${s.label} no TSE…`;$('error').hidden=true;try{const r=await fetch(`${s.url}?_=${Date.now()}`,{cache:'no-store'});if(!r.ok)throw Error(`HTTP ${r.status}`);const p=parse(await r.json(),s);state.rows=p.rows;render(p,s);$('status').className='status ok';$('status').textContent=`Fonte consultada com sucesso · atualização publicada: ${p.updated||'não informada'}`}catch(e){state.rows=[];$('status').className='status bad';$('status').textContent='Não foi possível consultar a fonte oficial.';$('error').hidden=false;$('error').textContent=e.message;render({title:s.label,rows:[]},s)}}
function render(p,s){$('office').value=state.key;$('title').textContent=p.title||s.label;$('scope').textContent=state.key==='presidente'?'Recorte exibido: Pará, a partir do acompanhamento oficial por UF.':'Recorte: estado do Pará';$('summary').innerHTML=[['Votos válidos',fmt(p.valid)],['Votos totais',fmt(p.total)],['Eleitorado apurado',fmt(p.counted)],['Última publicação',p.updated||'—']].map(x=>`<div class="metric"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join('');const rows=[...p.rows].sort((a,b)=>state.descending?b.votes-a.votes:a.votes-b.votes);$('candidates').innerHTML=rows.length?rows.map(c=>`<tr><td class="candidate">${esc(c.name)}<span class="party">${esc(c.party)}</span></td><td>${esc(c.number)}</td><td>${fmt(c.votes)}</td><td>${c.pct==null?'—':String(c.pct).replace('.',',')+'%'}</td></tr>`).join(''):'<tr><td colspan="4" class="empty">O TSE respondeu, mas este arquivo não trouxe candidatos para o recorte selecionado.</td></tr>'}
$('office').innerHTML=Object.entries(SOURCES).map(([k,v])=>`<option value="${k}">${v.label}</option>`).join('');$('office').onchange=e=>{state.key=e.target.value;load()};$('refresh').onclick=load;$('sort').onclick=()=>{state.descending=!state.descending;$('sort').textContent=`Ordenar: votos ${state.descending?'↓':'↑'}`;render({title:SOURCES[state.key].label,rows:state.rows},SOURCES[state.key])};$('interval').onchange=e=>{clearInterval(state.timer);const n=Number(e.target.value);if(n)state.timer=setInterval(load,n*1000)};$('interval').dispatchEvent(new Event('change'));load();
</script></body></html>

<section class="newsletter" aria-labelledby="newsletter-title">
  <h2 id="newsletter-title">{{ site.newsletter_title }}</h2>
  <p>{{ site.newsletter_description }}</p>
  <form class="newsletter-form" action="{{ site.newsletter_action }}" method="post">
    <label for="newsletter-name">Seu nome</label>
    <input id="newsletter-name" name="name" type="text" autocomplete="name" placeholder="Como posso te chamar?">
    <label for="newsletter-email">Seu e-mail</label>
    <input id="newsletter-email" name="email" type="email" autocomplete="email" placeholder="voce@exemplo.com" required>
    <button type="submit">[ assinar newsletter ]</button>
  </form>
</section>
